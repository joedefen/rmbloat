[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "rmbloat"
version = "1.0.0"
readme = "README.md"
description = "An intelligent FFmpeg utility for prioritizing and converting inefficient video files (BLOAT score)."
authors = [
    { name = "Joe Defen", email = "joedef@duck.com" }
]
requires-python = ">=3.11"
dependencies = [
    "console-window==2.2.2",
    "ruamel.yaml>=0.18.16",
    "ruamel.yaml.clib>=0.2.15",
    "Send2Trash>=1.8.3",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
]

[project.urls]
"Homepage" = "https://github.com/joedefen/rmbloat"

[project.license]
text = "MIT"

[project.scripts]
rmbloat = "rmbloat.rmbloat:main"
rmbloatd = "rmbloat.rmbloatd:main"

# Development gates.  `./linter` requires pylint to be importable by the same
# interpreter that has the runtime dependencies, so pylint lives here rather
# than being borrowed from another interpreter on PATH:
#     python -m pip install -e '.[dev]'
[project.optional-dependencies]
dev = [
    "pylint>=3.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"