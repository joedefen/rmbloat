[build-system]
requires = ["flit_core>=3.12,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "rmbloat"
dynamic = ["version"]
readme = "README.md"
description = "An intelligent FFmpeg utility for prioritizing and converting inefficient video files (BLOAT score)."
authors = [
    { name = "Joe Defen", email = "joedef@duck.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "console-window~=3.1.0",
    "ruamel.yaml>=0.18.16",
    "ruamel.yaml.clib>=0.2.15",
    "Send2Trash>=1.8.3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
]

[project.urls]
"Homepage" = "https://github.com/joedefen/rmbloat"

[project.scripts]
rmbloat = "rmbloat.rmbloat:main"
rmbloatd = "rmbloat.rmbloatd:main"
